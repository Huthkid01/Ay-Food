    <path d="M66 40c8 10 8 22 2 34-1.2 2.4-4.8 2.2-5.6-.4-3.5-11.2-2.2-20.5 3.6-30.2.8-1.4 2.8-1.6 4-.4Z"/>
    <rect x="62.5" y="72" width="6" height="18" rx="2"/>
  </g>

  <!-- Wordmark — Fraunces loaded site-wide; Georgia fallback -->
  <g fill="#FFFFFF" font-family="Fraunces, Georgia, 'Times New Roman', serif">
    <text x="118" y="58" font-size="42" font-weight="700" letter-spacing="-0.5">Ay Food</text>
  </g>
  <g fill="#F97316" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif">
